---
- name: Provision server environment
  hosts: target
  become: true
  pre_tasks:
    - name: Validate SSH_HOST shape before attempting connection
      ansible.builtin.assert:
        that:
          - ansible_host | length > 0
          - ansible_host is match('^[A-Za-z0-9.-]+$')
          - ansible_host | trim == ansible_host
        fail_msg: >-
          SSH_HOST looks malformed: '{{ ansible_host }}'.
          It must be the bare tailnet IP (100.x.y.z) or MagicDNS name:
          letters/digits/dots/hyphens only - no quotes, no ':port',
          no surrounding spaces or newlines.
  roles:
    - role: docker
    - role: ghcr_login
      become: false   # credentials must land in the SSH user's home
    - role: mongo_image
