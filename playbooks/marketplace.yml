---
- name: Deploy commons-marketplace API from ghcr.io
  hosts: target
  become: true
  # Facts are gathered manually after validating the connection target:
  # pre_tasks would otherwise run after fact gathering, which is the very
  # first SSH operation and the one that fails on a malformed host.
  gather_facts: false
  pre_tasks:
    - name: Validate SSH_HOST before any connection attempt
      ansible.builtin.assert:
        that:
          - ansible_host | trim | length > 0
          - ansible_host is match('^[A-Za-z0-9.-]+$')
        fail_msg: >-
          SSH_HOST resolves to '{{ ansible_host }}'.
          It must be the bare tailnet IP (100.x.y.z) or MagicDNS name:
          letters/digits/dots/hyphens only - no quotes, no ':port',
          no surrounding spaces or newlines.
        quiet: false

    - name: Validate DB_URL before deploying
      ansible.builtin.assert:
        that:
          - marketplace_env.DB_URL | trim | length > 0
          - marketplace_env.DB_URL is match('^mongodb(\+srv)?://\S+')
        fail_msg: >-
          DB_URL must be a complete MongoDB connection string starting with
          'mongodb://' or 'mongodb+srv://' followed by credentials/host.
          The configured value failed this check - verify the DB_URL
          repository secret (the value itself is never printed here).
        quiet: false

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: ghcr_login   # SSH-user credentials for manual pulls on the host
    - role: marketplace
