---
# Connection
ansible_connection: ssh

# Docker provision
# User to add to the 'docker' group; defaults to the SSH user.
docker_install_user: "{{ lookup('env', 'SSH_USERNAME') }}"

# ghcr.io login (optional; empty values skip the login tasks)
ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"

# Base images
mongo_image: "{{ lookup('env', 'MONGO_IMAGE') | default('mongo:8', true) }}"

# Shared Docker network for all stacks (sonar, future mongo, app)
docker_network_name: "{{ lookup('env', 'DOCKER_NETWORK_NAME') | default('commons-net', true) }}"

# PostgreSQL backing SonarQube
postgres_image: "{{ lookup('env', 'POSTGRES_IMAGE') | default('postgres:18', true) }}"
postgres_container_name: sonar-postgres
postgres_host_data_dir: "{{ lookup('env', 'POSTGRES_HOST_DATA_DIR') | default('/opt/sonar-postgres/data', true) }}"
postgres_user: "{{ lookup('env', 'POSTGRES_USER') | default('sonar', true) }}"
postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
postgres_db: "{{ lookup('env', 'POSTGRES_DB') | default('sonar', true) }}"
postgres_env:
    POSTGRES_USER: "{{ postgres_user }}"
    POSTGRES_PASSWORD: "{{ postgres_password }}"
    POSTGRES_DB: "{{ postgres_db }}"

# SonarQube
# NOTE: the '-lta-' tags only exist for commercial editions; Community
# Build publishes 'community' (rolling latest) and '<version>-community'.
sonarqube_image: >-
    {{ lookup('env', 'SONARQUBE_IMAGE') | default('sonarqube:community', true) }}
sonarqube_container_name: sonar
sonarqube_host_data_dir: "{{ lookup('env', 'SONARQUBE_HOST_DATA_DIR') | default('/opt/sonarqube/data', true) }}"
sonarqube_host_extensions_dir: "{{ lookup('env', 'SONARQUBE_HOST_EXTENSIONS_DIR') | default('/opt/sonarqube/extensions', true) }}"
sonarqube_host_logs_dir: "{{ lookup('env', 'SONARQUBE_HOST_LOGS_DIR') | default('/opt/sonarqube/logs', true) }}"
sonarqube_port: "{{ lookup('env', 'SONARQUBE_PORT') | default('9000', true) }}"
sonarqube_startup_timeout: "{{ lookup('env', 'SONARQUBE_STARTUP_TIMEOUT') | default(300, true) | int }}"
sonar_env:
    SONAR_JDBC_URL: "jdbc:postgresql://{{ postgres_container_name }}:5432/{{ postgres_db }}"
    SONAR_JDBC_USERNAME: "{{ postgres_user }}"
    SONAR_JDBC_PASSWORD: "{{ postgres_password }}"

# commons-marketplace API (ghcr.io/carlosgarcia-tech/commons-marketplace,
# published by the app repo's CI with version, sha and latest tags)
marketplace_image: >-
    {{ lookup('env', 'MARKETPLACE_IMAGE') | default('ghcr.io/carlosgarcia-tech/commons-marketplace:latest', true) }}
# Host-side publish port; owned by the reverse proxy, whose upstream
# always targets container port 3000 (the image HEALTHCHECK probes it).
marketplace_host_port: "{{ lookup('env', 'MARKETPLACE_PORT') | default('3000', true) }}"
marketplace_env:
    NODE_ENV: production
    PORT: "3000"
    DB_URL: "{{ lookup('env', 'DB_URL') }}"
    SUPABASE_URL: "{{ lookup('env', 'SUPABASE_URL') }}"
    SUPABASE_PUBLISHABLE_KEY: "{{ lookup('env', 'SUPABASE_PUBLISHABLE_KEY') }}"
    SUPABASE_SECRET_KEY: "{{ lookup('env', 'SUPABASE_SECRET_KEY') }}"
    SUPABASE_STORAGE_BUCKET: "{{ lookup('env', 'SUPABASE_STORAGE_BUCKET') }}"
    ABLY_API_KEY: "{{ lookup('env', 'ABLY_API_KEY') }}"
    CORS_ORIGINS: "{{ lookup('env', 'CORS_ORIGINS') }}"
    # One nginx hop (the blue-green proxy) sits in front of the app
    TRUST_PROXY: "{{ lookup('env', 'TRUST_PROXY') | default('1', true) }}"

# Blue-green reverse proxy: publishes marketplace_host_port and routes to
# whichever color container last passed its health gate.
marketplace_proxy_name: commons-proxy
marketplace_proxy_image: "{{ lookup('env', 'MARKETPLACE_PROXY_IMAGE') | default('nginx:1.29-alpine', true) }}"
marketplace_proxy_conf_dir: "{{ lookup('env', 'MARKETPLACE_PROXY_CONF_DIR') | default('/opt/commons-proxy/conf.d', true) }}"

# commons-marketplace client (ghcr.io/carlosgarcia-tech/commons-marketplace-client).
# Same blue-green pattern; its nginx is the SINGLE public entrypoint:
# routes /* to the active color and /api + /socket.io to the API proxy.
client_image: >-
    {{ lookup('env', 'CLIENT_IMAGE') | default('ghcr.io/carlosgarcia-tech/commons-marketplace-client:latest', true) }}
client_proxy_name: commons-client-proxy
client_proxy_image: "{{ lookup('env', 'CLIENT_PROXY_IMAGE') | default('nginx:1.29-alpine', true) }}"
client_proxy_conf_dir: "{{ lookup('env', 'CLIENT_PROXY_CONF_DIR') | default('/opt/commons-client-proxy/conf.d', true) }}"
# Host-side publish port - this is what `tailscale funnel <port>` targets.
client_host_port: "{{ lookup('env', 'CLIENT_PORT') | default('8080', true) }}"
# Stable address of the API blue-green proxy on commons-net.
client_api_upstream_host: "{{ lookup('env', 'CLIENT_API_UPSTREAM_HOST') | default('commons-proxy', true) }}"
client_api_upstream_port: "{{ lookup('env', 'CLIENT_API_UPSTREAM_PORT') | default('80', true) }}"
