---
# Blue-green deployment for the API. Two interchangeable containers
# (commons-marketplace-blue / -green) sit behind an nginx proxy on the
# shared network. Traffic switches via an nginx reload only after the
# incoming color passes its health gate; a failed public verification
# auto-reverts, so a bad release never reaches users.

# The image lives in ghcr.io and may be private. Container tasks run
# through the root-owned docker socket, so pulls authenticate with
# /root/.docker/config.json - not the SSH user's credentials written by
# the ghcr_login role; hence this second, root-context login.
- name: Log in to ghcr.io (root context)
  community.docker.docker_login:
    registry_url: https://ghcr.io
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"
  become: true
  no_log: true
  when:
    - ghcr_username | default('') | length > 0
    - ghcr_token | default('') | length > 0

# Same skip-if-present pattern as the sonarqube role: images loaded
# manually (docker load) never touch the registry, so slow server links
# do not burn CI minutes.
- name: Ensure shared Docker network exists
  community.docker.docker_network:
    name: "{{ docker_network_name }}"
    state: present

- name: Check {{ marketplace_image }} image presence
  ansible.builtin.command:
    cmd: docker image inspect "{{ marketplace_image }}"
  register: mp_image_present
  changed_when: false
  failed_when: false

- name: Pull {{ marketplace_image }} image
  community.docker.docker_image:
    name: "{{ marketplace_image }}"
    source: pull
  register: mp_pull
  retries: 5
  delay: 15
  until: mp_pull is succeeded
  when: mp_image_present.rc != 0

# --- color bookkeeping --------------------------------------------------

- name: Read current proxy routing configuration
  ansible.builtin.slurp:
    src: "{{ marketplace_proxy_conf_dir }}/marketplace.conf"
  register: mp_current_conf
  failed_when: false

- name: Determine active and target colors
  ansible.builtin.set_fact:
    mp_active: >-
      {{ 'green' if (mp_current_conf.content is defined and mp_current_conf is succeeded
                     and 'commons-marketplace-green:3000;' in (mp_current_conf.content | b64decode))
              else 'blue' }}
    # Legacy pre-blue-green container still holds the published port
    mp_legacy_container: commons-marketplace

- name: Set target color and route names
  ansible.builtin.set_fact:
    mp_target: "{{ 'green' if mp_active == 'blue' else 'blue' }}"
    mp_target_name: "commons-marketplace-{{ 'green' if mp_active == 'blue' else 'blue' }}"
    mp_active_name: "commons-marketplace-{{ mp_active }}"

- name: Report deployment plan
  ansible.builtin.debug:
    msg: >-
      Active color '{{ mp_active }}' keeps serving;
      deploying image {{ marketplace_image }} as '{{ mp_target }}'.

# --- new color ----------------------------------------------------------

- name: Retire legacy single container (pre blue-green naming)
  community.docker.docker_container:
    name: "{{ mp_legacy_container }}"
    state: absent

- name: Deploy {{ mp_target_name }} container
  community.docker.docker_container:
    name: "{{ mp_target_name }}"
    image: "{{ marketplace_image }}"
    restart_policy: unless-stopped
    networks:
      - name: "{{ docker_network_name }}"
    env: "{{ marketplace_env }}"
    comparisons:
      image: ignore   # updates happen via tag bumps, not digest drift
    # no published_ports: ingress goes exclusively through the proxy

- name: Health-gate {{ mp_target_name }} inside its container
  # docker exec via CLI (same proven pattern as the postgres wait), with
  # the polling loop INSIDE the container: one SSH session instead of
  # dozens, and the real wget output is captured on failure.
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ mp_target_name }}"
      - sh
      - -c
      - >-
        for i in $(seq 1 24); do
          wget --spider -qT 5 http://127.0.0.1:3000/health && exit 0;
          sleep 5;
        done;
        echo "health gate exhausted"; exit 1
  register: mp_gate
  changed_when: false
  failed_when: mp_gate.rc != 0

# --- switch -------------------------------------------------------------

- name: Ensure proxy config directory exists
  ansible.builtin.file:
    path: "{{ marketplace_proxy_conf_dir }}"
    state: directory
    mode: "0755"

- name: Point proxy at {{ mp_target }}
  ansible.builtin.template:
    src: marketplace.conf.j2
    dest: "{{ marketplace_proxy_conf_dir }}/marketplace.conf"
    mode: "0644"
  vars:
    mp_route_color: "{{ mp_target }}"
  register: mp_route_switched

- name: Run reverse proxy on port {{ marketplace_host_port }}
  community.docker.docker_container:
    name: "{{ marketplace_proxy_name }}"
    image: "{{ marketplace_proxy_image }}"
    restart_policy: unless-stopped
    networks:
      - name: "{{ docker_network_name }}"
    published_ports:
      - "{{ marketplace_host_port }}:80"
    volumes:
      - "{{ marketplace_proxy_conf_dir }}:/etc/nginx/conf.d:ro"

- name: Reload proxy routing without dropping connections
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ marketplace_proxy_name }}"
      - nginx
      - -s
      - reload
  when: mp_route_switched is changed
  changed_when: true

- name: Verify public endpoint through the proxy
  block:
    - name: Wait for healthy response on port {{ marketplace_host_port }}
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ marketplace_host_port }}/health"
      register: api_health
      retries: 12
      delay: 5
      until: api_health.status == 200
      # HTTP against loopback needs no privileges; running this without
      # sudo avoids fresh-connection become prompts timing out mid loop.
      become: false

  rescue:
    - name: Revert proxy routing to {{ mp_active }}
      ansible.builtin.template:
        src: marketplace.conf.j2
        dest: "{{ marketplace_proxy_conf_dir }}/marketplace.conf"
        mode: "0644"
      vars:
        mp_route_color: "{{ mp_active }}"

    - name: Apply reverted routing
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ marketplace_proxy_name }}"
          - nginx
          - -s
          - reload
      failed_when: false
      changed_when: true

    - name: Fail the deployment with rollback notice
      ansible.builtin.fail:
        msg: >-
          {{ mp_target }} did not serve a healthy /health through the
          proxy; traffic was rolled back to {{ mp_active }}, which stays
          running for inspection. Check its logs before retrying.

# --- retire -------------------------------------------------------------

- name: Check whether {{ mp_active_name }} exists
  community.docker.docker_container_info:
    name: "{{ mp_active_name }}"
  register: mp_active_info

- name: Park previous color container (stopped, kept for instant rollback)
  # Stopped - not removed: it preserves the exact image/env combination
  # that served traffic until now, so the Marketplace Rollback workflow
  # can flip traffic back in seconds without pulling anything. The next
  # deploy reuses this slot as its target color. Skipped on first-ever
  # deploy, where the nominal opposite color does not exist yet.
  community.docker.docker_container:
    name: "{{ mp_active_name }}"
    state: stopped
  when: mp_active_info.exists
