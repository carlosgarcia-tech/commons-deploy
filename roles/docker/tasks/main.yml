---
- name: Report target operating system
  ansible.builtin.debug:
    msg: >-
      {{ ansible_facts['distribution'] | default('?') }}
      {{ ansible_facts['distribution_version'] | default('?') }}
      (family={{ ansible_facts['os_family'] | default('?') }},
      arch={{ ansible_facts['architecture'] | default('?') }})

# NOTE: Fedora reports os_family = 'RedHat'; dispatch by exact distribution.
- name: Install Docker packages (Debian family)
  ansible.builtin.include_tasks: Debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Docker packages (Fedora)
  ansible.builtin.include_tasks: Fedora.yml
  when: ansible_facts['distribution'] == 'Fedora'

- name: Fail on unsupported distributions
  ansible.builtin.fail:
    msg: >-
      Unsupported distribution '{{ ansible_facts['distribution'] }}'
      (family={{ ansible_facts['os_family'] }}). The docker role supports
      Debian/Ubuntu and Fedora; extend it if you need another one.
  when: >-
    ansible_facts['os_family'] not in ['Debian', 'RedHat'] or
    (ansible_facts['os_family'] == 'RedHat' and
     ansible_facts['distribution'] != 'Fedora')

- name: Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ docker_install_user }}"
    groups: docker
    append: true
  when: docker_install_user | default('') | length > 0 and docker_install_user != 'root'
