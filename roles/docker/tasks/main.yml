---
- name: Report target operating system
  ansible.builtin.debug:
    msg: >-
      {{ ansible_distribution | default('?') }}
      {{ ansible_distribution_version | default('?') }}
      (family={{ ansible_os_family | default('?') }},
      arch={{ ansible_architecture | default('?') }})

- name: Install Docker packages (Debian family)
  ansible.builtin.include_tasks: Debian.yml
  when: ansible_os_family == 'Debian'

- name: Install Docker packages (Fedora)
  ansible.builtin.include_tasks: Fedora.yml
  when: ansible_os_family == 'Fedora'

- name: Fail on unsupported distributions
  ansible.builtin.fail:
    msg: >-
      Unsupported distribution family '{{ ansible_os_family }}'.
      The docker role supports Debian/Ubuntu and Fedora; extend it if you
      need another family.
  when: ansible_os_family not in ['Debian', 'Fedora']

- name: Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ docker_install_user }}"
    groups: docker
    append: true
  when: docker_install_user | default('') | length > 0 and docker_install_user != 'root'
