name: Provision

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    provision:
        name: Install Docker, GHCR login and base images
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Reachability gate
              uses: ./.github/actions/tailscale-gate
              with:
                  authkey: ${{ secrets.TS_AUTHKEY }}
                  ssh-host: ${{ secrets.SSH_HOST }}

            - name: Ansible setup
              uses: ./.github/actions/ansible-setup
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Run provision playbook
              run: ansible-playbook playbooks/provision.yml
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
                  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
                  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
