name: Ping

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ping:
        name: Verify tailnet reachability
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Reachability gate
              uses: ./.github/actions/tailscale-gate
              with:
                  authkey: ${{ secrets.TS_AUTHKEY }}
                  ssh-host: ${{ secrets.SSH_HOST }}
