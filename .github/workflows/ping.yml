name: Ping

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ping
    cancel-in-progress: true

jobs:
    ping:
        name: Verify tailnet reachability
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Reachability gate
              uses: ./.github/actions/tailscale-gate
              with:
                  authkey: ${{ secrets.TS_AUTHKEY }}
                  ssh-host: ${{ secrets.SSH_HOST }}
