[defaults]
inject_facts_as_vars = False
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# Slow tailnet links + loaded home servers routinely exceed the 10s
# default before a fresh sudo prompt answers, which used to kill long
# retry-loops with 'Timeout waiting for privilege escalation prompt'.
timeout = 30

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=accept-new
pipelining = True
